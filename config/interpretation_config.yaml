# Interpretation engine config (AD-8, FR-12). Model IDs are config-driven and
# resolved against current availability at deploy time — NEVER hard-coded in code.
# The placeholder aliases below map to real Claude model IDs in the deployment env.
interpretation:
  default_model: claude-sonnet-5        # efficient, large-volume (spec §8.5)
  escalation_model: claude-opus-4-8     # high-stakes reasoning
  escalation_triggers:
    topic_in: ["csrd_scope", "epant_decision", "ste_decision"]
    self_flag: requires_specialist_review
  temperature: 0.2
  max_tokens: 4000
