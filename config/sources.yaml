# Source registry (AD-8). tier, endpoint, cadence, authority_rank (lower = more
# authoritative, used as the dedup merge tie-breaker — AD-8 / L1 fix), plus an
# `adapter` key (resolved via adapters/registry.py) and adapter-specific
# `options` kept as data. Only FakeSource is enabled by default; real Tier-1
# adapters flip `enabled: true` once their credentials/cadence are signed off.

# Lookback window (days): Items published longer ago than this are skipped before
# triage/interpretation — bounds the first-run backfill and saves LLM cost.
# 0 disables it; undated Items always pass. Tune for the initial crawl.
max_age_days: 180

sources:
  # Offline demo fixture — DISABLED so no synthetic items reach the real DB.
  # Tests instantiate FakeSourceAdapter directly; they don't rely on this flag.
  - name: FakeSource
    tier: 1
    endpoint: "memory://fixtures"
    cadence: "30m"
    authority_rank: 1
    enabled: false
    adapter: fake

  # --- Tier 1 (official) — authority_rank 1 ---
  - name: EUR-Lex
    tier: 1
    endpoint: "http://publications.europa.eu/webapi/rdf/sparql"
    cadence: "daily"          # POC: driven by the Railway cron
    authority_rank: 1
    enabled: true             # validated live (POC)
    adapter: eurlex
    options:
      lookback_days: 30       # daily run headroom; global max_age_days still bounds age
      language: ENG
      content_language: el
      limit: 100
      resource_types: [REG, DIR, JUDG, ORDER, OPIN_JUR]
      # EuroVoc pre-filter for the client's compliance domains (spec §5.1.1).
      eurovoc_descriptors:
        - tobacco industry
        - manufactured tobacco
        - excise duty
        - foodstuff
        - food safety
        - food labelling
        - food additive
        - personal data protection
        - sustainable development
        - corporate social responsibility
        - competition law
        - restrictive-trade practice
        - distribution agreement

  - name: Διαύγεια
    tier: 1
    # Opendata search is the luminapi endpoint (the /opendata/search path ignores
    # the org filter). Adapter appends /search. Verified live 2026-08.
    endpoint: "https://opendata.diavgeia.gov.gr/luminapi/api"
    cadence: "daily"          # POC: driven by the Railway cron
    authority_rank: 1
    enabled: true             # validated live (POC)
    adapter: diavgeia
    options:
      lookback_days: 180
      page_size: 40           # bound the daily admin-noise volume (POC)
      # Diavgeia organization UIDs (from /opendata/organizations). Verified:
      #   22963 = ΕΠΙΤΡΟΠΗ ΑΝΤΑΓΩΝΙΣΜΟΥ (ΕπΑντ)
      #   22951 = ΑΡΧΗ ΠΡΟΣΤΑΣΙΑΣ ΔΕΔΟΜΕΝΩΝ ΠΡΟΣΩΠΙΚΟΥ ΧΑΡΑΚΤΗΡΑ (ΑΠΔΠΧ)
      # TODO: add ΑΑΔΕ, ΕΦΕΤ + client's competent ministries (look up their UIDs).
      organization_uids: [22963, 22951]

  - name: Βουλή
    tier: 1
    endpoint: "https://www.hellenicparliament.gr/api.ashx"
    cadence: "daily@08:00"
    authority_rank: 1
    enabled: false
    adapter: vouli
    options:
      method: Bills
      period: 20
      default_type: Νομοσχέδιο

  - name: EDPB
    tier: 1
    endpoint: "https://www.edpb.europa.eu/rss/documents_en.rss"
    cadence: "daily@09:00"
    authority_rank: 1
    enabled: false
    adapter: rss
    options:
      authority: EDPB
      default_type: Publication

  - name: EFSA
    tier: 1
    endpoint: "https://www.efsa.europa.eu/en/rss/all"
    cadence: "daily@09:00"
    authority_rank: 1
    enabled: false
    adapter: rss
    options:
      authority: EFSA
      default_type: Scientific Output

  - name: GDPRhub
    tier: 1
    endpoint: "https://gdprhub.eu/api.php"
    cadence: "daily@10:00"
    authority_rank: 2
    enabled: false
    adapter: gdprhub
    options:
      namespace: 0
      limit: 50
      authority: GDPRhub
      default_type: DPA Decision

  - name: data.gov.gr
    tier: 1
    endpoint: "https://data.gov.gr/api/v1"
    cadence: "daily@10:00"
    authority_rank: 2
    enabled: false
    adapter: datagovgr
    options:
      api_key_env: DATA_GOV_GR_API_KEY
      dataset: ""

  # --- Tier 2 (scraping) — authority_rank 1 (official sites) ---
  # Row/link/id selectors below are best-effort defaults; each MUST be verified
  # against the live page at activation (spec §5.2). All routing is via the
  # politeness-enforcing ScrapeClient (AD-10).
  - name: ΦΕΚ
    tier: 2
    endpoint: "https://search.et.gr/en/"
    cadence: "12h"
    authority_rank: 1
    enabled: false
    adapter: fek
    options:
      row_tag: div
      row_class: result-item
      link_contains: ".pdf"
      default_type: ΦΕΚ
      authority: Εθνικό Τυπογραφείο

  - name: ΣτΕ
    tier: 2
    endpoint: "https://www.adjustice.gr/webcenter/portal/ste/ypiresies/nomologies"
    cadence: "daily@22:00"
    authority_rank: 1
    enabled: false
    adapter: ste
    options:
      row_tag: tr
      default_type: Απόφαση ΣτΕ
      authority: Συμβούλιο της Επικρατείας

  - name: ΕπΑντ
    tier: 2
    endpoint: "https://www.epant.gr/apofaseis-gnomodotiseis.html"
    cadence: "weekly@Mon09:00"   # weekly direct cross-check; primary path is Δι@ύγεια
    authority_rank: 1
    enabled: false
    adapter: epant
    options:
      row_tag: div
      row_class: item
      default_type: Απόφαση ΕπΑντ
      authority: Επιτροπή Ανταγωνισμού
      note: "Primary coverage is via the Διαύγεια source with the ΕπΑντ org UID."

  - name: ΕΦΕΤ
    tier: 2
    endpoint: "https://www.efet.gr/index.php/el/enimerosi/deltia-typou/anakleiseis-cat"
    cadence: "4h"
    authority_rank: 1
    enabled: false
    adapter: efet
    options:
      row_tag: div
      row_class: item
      default_type: Ανάκληση
      authority: ΕΦΕΤ
      parse_hazard: true
      hazards:
        - {keyword: "listeria", label: "Listeria"}
        - {keyword: "salmonella", label: "Salmonella"}
        - {keyword: "υδράργυρ", label: "Υδράργυρος"}
        - {keyword: "αλλεργιογ", label: "Αλλεργιογόνο"}
        - {keyword: "μυκοτοξ", label: "Μυκοτοξίνες"}

  - name: RASFF
    tier: 2
    endpoint: "https://webgate.ec.europa.eu/rasff-window/screen/list"
    cadence: "4h"
    authority_rank: 1
    enabled: false
    adapter: rasff
    options:
      mechanism: apitalks   # "apitalks" (paid REST) | "scrape" (JS-capable fetcher)
      apitalks_endpoint: ""
      apitalks_key_header: "x-api-key"
      apitalks_key: ""
      default_type: RASFF Notification
      authority: RASFF
      hazards:
        - {keyword: "pathogenic", label: "Pathogens"}
        - {keyword: "listeria", label: "Listeria"}
        - {keyword: "heavy metal", label: "Heavy metals"}
        - {keyword: "mycotoxin", label: "Mycotoxins"}
        - {keyword: "allergen", label: "Allergens"}

  - name: dpa.gr
    tier: 2
    endpoint: "https://www.dpa.gr/el/enimerwtiko/prakseisArxis"
    cadence: "weekly@Tue09:00"
    authority_rank: 1
    enabled: false
    adapter: dpa
    options:
      row_tag: div
      row_class: item
      default_type: Πράξη ΑΠΔΠΧ
      authority: ΑΠΔΠΧ

  # --- Official aggregators — authority_rank 2 ---
  - name: kodiko.gr
    tier: 3
    endpoint: "https://www.kodiko.gr"
    cadence: "daily@11:00"
    authority_rank: 2
    enabled: false

  # --- Commercial aggregators — authority_rank 3 ---
  - name: taxheaven.gr
    tier: 3
    endpoint: "https://www.taxheaven.gr"
    cadence: "daily@11:00"
    authority_rank: 3
    enabled: false

  # --- Tier 3 commercial shared inbox — authority_rank 3 (never wins metadata) ---
  # Reads ONLY the dedicated shared inbox; newsletters are BCC-forwarded here so
  # the legal counsel's personal mailbox is never touched (spec §5.3).
  - name: Commercial Inbox
    tier: 3
    endpoint: "imap://imap.example.com"
    cadence: "30m"   # inbox trigger in prod; poll fallback
    authority_rank: 3
    enabled: false
    adapter: inbox
    options:
      inbox_address: "legal-intel@client-domain.gr"
      imap_host_env: LEGAL_INTEL_IMAP_HOST
      imap_password_env: LEGAL_INTEL_IMAP_PASSWORD
      default_source_name: "Commercial Newsletter"
      default_type: Newsletter
      max_links_per_email: 20
      link_allow_domains: []   # optional allowlist of publisher domains
      sender_source_map:
        "taxheaven.gr": "taxheaven.gr"
        "qualex": "Qualex"
        "nb.org": "NB Daily"
        "lawspot": "Lawspot"
