# Deterministic relevance rules (AD-8, FR-7). Evaluated BEFORE the LLM classifier.
# Kept separate from ontology.yaml because these change more often (spec §7.3).
# KAD codes for this client (spec §7.3):
kad_codes: ["46.35", "46.37", "46.38", "56.10", "56.30"]

# LLM classifier routing + Class C retention (spec §7.2/§7.6).
triage:
  high_confidence: 0.85          # >this on high/low → auto A/B; else Class C
  class_c_ttl_days: 7            # staging full-text TTL before `overdue`
  class_c_sla_business_days: 2   # relevance-review SLA (metrics)

rules:
  # --- Explicit include (auto Class A) ---
  - rule_id: kad_direct_mention
    action: classify_A
    label: "Αναφέρεται ρητά σε ΚΑΔ του πελάτη (46.35, 46.37, 46.38, 56.10, 56.30)."
    when:
      text_contains_kad_any: ["46.35", "46.37", "46.38", "56.10", "56.30"]

  - rule_id: high_priority_topic_hit
    action: classify_A
    label: "Άπτεται θέματος άμεσης σχετικότητας (ιχνηλασιμότητα καπνού, ΕΦΚ, επισήμανση τροφίμων, ανάκληση προϊόντων ή κάθετες συμφωνίες)."
    when:
      topics_contains_any:
        - tobacco_traceability
        - tobacco_excise
        - food_labeling
        - food_recall
        - vertical_agreements

  # --- Explicit exclude (auto Class B) ---
  - rule_id: unrelated_sectors
    action: classify_B
    label: "Εκτός πεδίου δραστηριότητας (δασικά, στρατιωτικά, ναυτιλιακά, θρησκευτικά ή χωροταξία)."
    when:
      topics_all_in:
        - forestry
        - military
        - maritime
        - religious_affairs
        - urban_planning_non_retail
