[project]
name = "legal-intel"
version = "0.0.0"
description = "Legal Intelligence Collection Layer — Environment A (Claude Code production pipeline). Phase 0 walking skeleton."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
]

# Heavy integrations are lazy-imported by the real backends only, so the Phase-0
# fake-data walking skeleton (and its tests) run offline with just the core deps.
[project.optional-dependencies]
full = [
    "notion-client==3.1.0",
    "anthropic",
    "claude-agent-sdk>=0.2,<0.3",
    "httpx",
    "playwright",
    "pdfplumber",
    "apscheduler>=3,<4",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_intel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
